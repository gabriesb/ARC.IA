name: Build, Push & Terraform (infra/)

on:
  # Dispara quando um PR de devops_agent -> main é fechado.
  # A condição `merged == true` no job garante que só rode em PRs de fato
  # mergeados (portanto, aprovados conforme a proteção de branch da main).
  pull_request:
    types: [closed]
    branches: ["main"]        # ajuste para a branch desejada (var.build_branch)
    paths:
      - "src/**"              # só dispara quando o código do agent mudar
  workflow_dispatch:          # permite disparar manualmente pelo GitHub
    inputs:
      action:
        description: "Ação a executar na infraestrutura do runtime (infra/)"
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply

permissions:
  id-token: write             # necessário para OIDC
  contents: read

jobs:
  build-push:
    # Roda em: PR de devops_agent ou arkia mergeado em main, ou disparo manual com action=apply
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && contains(fromJSON('["devops_agent", "arkia"]'), github.event.pull_request.head.ref)) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configura QEMU (emulação ARM64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Configura Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem ARM64
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: agent_ecr
        run: |
          docker build \
            --platform linux/arm64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            src/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Imagem publicada: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.0"

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve -var="image_tag=${{ env.IMAGE_TAG }}"

  destroy:
    # Só roda em disparo manual com action=destroy — nunca automaticamente
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    # Recomendado: crie um Environment "destroy-approval" em
    # Settings > Environments com reviewers obrigatórios, para exigir
    # aprovação manual antes de destruir a infraestrutura.
    environment: destroy-approval

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.0"

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Destroy
        working-directory: infra
        run: terraform destroy -auto-approve
