name: Terraform Destroy – AgentCore Environment

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to confirm environment destruction"
        required: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_IN_AUTOMATION: true

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Abort if not confirmed
        if: ${{ github.event.inputs.confirm_destroy != 'DESTROY' }}
        run: |
          echo "Destruction not confirmed. Aborting."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Get ECR repository name from Terraform
        working-directory: infra
        run: |
          echo "ECR_REPO_NAME=$(terraform output -raw ecr_repository_name)" >> $GITHUB_ENV

      - name: Delete all images from ECR repository
        run: |
          IMAGES=$(aws ecr list-images \
            --repository-name $ECR_REPO_NAME \
            --query 'imageIds[*]' \
            --output json)

          if [ "$IMAGES" != "[]" ]; then
            aws ecr batch-delete-image \
              --repository-name $ECR_REPO_NAME \
              --image-ids "$IMAGES"
          else
            echo "No images found in ECR repository."
          fi

      - name: Terraform Destroy
        working-directory: infra
        run: terraform destroy -auto-approve
